<header
  #headerEl
  class="site-header"
  [class.is-wide]="isWide()"
  [class.is-scrolled]="isScrolled() || !isInicioRoute()"
  [class.is-over-hero]="isInicioRoute() && !isScrolled()"
  [class.is-measuring]="isMeasuring()"
>
  <div #headerInner class="header-inner">
    <a class="site-logo" routerLink="/inicio" aria-label="Ir al inicio">
      <span class="logo-emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
          <line x1="6" x2="6" y1="2" y2="4"/>
          <line x1="10" x2="10" y1="2" y2="4"/>
          <line x1="14" x2="14" y1="2" y2="4"/>
        </svg>
      </span>
      <span class="logo-text" [class.is-loading]="!brandName()">{{ brandName() }}</span>
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <button
        #menuBtn
        type="button"
        class="menu-button"
        popovertarget="site-menu"
        popovertargetaction="toggle"
        aria-controls="site-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="onFallbackToggle()"
      >
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          @if (menuOpen()) {
            <path d="M18 6 6 18M6 6l12 12"/>
          } @else {
            <line x1="4" x2="20" y1="7" y2="7"/>
            <line x1="4" x2="20" y1="12" y2="12"/>
            <line x1="4" x2="20" y1="17" y2="17"/>
          }
        </svg>
        <span>Menú</span>
      </button>

      <ul
        #siteMenu
        id="site-menu"
        class="site-menu"
        [class.is-open-fallback]="menuOpenFallback()"
        (toggle)="onPopoverToggle($event)"
      >
        @for (item of links; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              class="nav-link"
              (click)="closeMobileMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
